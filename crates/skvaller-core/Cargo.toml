[package]
name = "skvaller-core"
description = "Sync, storage and Google Reader API client for Skvaller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
dom_query = "0.29.0"
dom_smoothie = "0.19.0"
encoding_rs = "0.8.44"
feed-rs = { version = "3.0.0", default-features = false }
html5ever = "0.40.1"
keyring = "4.2.0"
opml = "1.1.6"
reqwest = { version = "0.13.5", features = ["form", "gzip", "json", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
xmlparser = "0.13.6"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
