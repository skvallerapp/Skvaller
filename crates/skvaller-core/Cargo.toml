[package]
name = "skvaller-core"
description = "Sync, storage and Google Reader API client for Skvaller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["rss", "feed-reader", "google-reader", "freshrss"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.23.1"
dom_query = "0.29.0"
dom_smoothie = "0.19.0"
encoding_rs = "0.8.44"
feed-rs = { version = "3.0.0", default-features = false }
html5ever = "0.40.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = "4.2.0"
opml = "1.1.6"
reqwest = { version = "0.13.5", features = ["form", "gzip", "json", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync"] }
xmlparser = "0.13.6"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
