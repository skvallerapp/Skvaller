[package]
name = "skvaller"
description = "Desktop RSS reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["rss", "feed-reader"]
categories = ["gui"]
publish = false

[features]
default = ["skia"]
# Renderers: Skia by default; the Vello ones for comparison. Vello hybrid scrolled with
# about 30% more CPU a second and panics on color emoji in an article.
skia = ["dioxus-native/skia"]
hybrid = ["dioxus-native/vello-hybrid"]
cpu = ["dioxus-native/vello-cpu-pixels"]
# Prints each frame's time, for measuring scrolling.
log-frame-times = ["dioxus-native/log-frame-times"]

[dependencies]
dioxus-native = { workspace = true, features = [
    "accessibility",
    "complex-scripts",
    "floats",
    "html",
    "net",
    "prelude",
    "scrollbars",
    "svg",
    "system-fonts",
] }
icu_calendar.workspace = true
icu_datetime.workspace = true
icu_locale_core.workspace = true
icu_segmenter.workspace = true
jiff.workspace = true
mimalloc.workspace = true
parley.workspace = true
rfd.workspace = true
serde_json.workspace = true
skvaller-app.workspace = true
skvaller-core.workspace = true
sys-locale.workspace = true
writeable.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
webbrowser.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
rustix.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols-plasma.workspace = true
x11rb.workspace = true
zbus.workspace = true

[lints]
workspace = true
