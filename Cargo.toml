[workspace]
members = ["crates/skvaller", "crates/skvaller-app", "crates/skvaller-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/skvallerapp/Skvaller"

[workspace.dependencies]
skvaller-app = { path = "crates/skvaller-app", version = "0.1.0" }
skvaller-core = { path = "crates/skvaller-core", version = "0.1.0" }

# Blitz and Dioxus Native move fast and aren't on crates.io in this form, so they come
# from a fork pinned to one commit. The fork adds what upstream lacks: single-select
# <select> (upstream PR #1321), a masked <input type=password>, iframe scrolling through
# MountedData, an app-set HTTP client, request filter and URL schemes, a 32 MB cap on
# decoded images, a wheel event's phase and source, button releases outside the window,
# redraws on a system theme change, more than one window, glyph caching so emoji don't
# panic Vello GPU, the bullet font kept with an embedder's fonts, word and line selection
# on double and triple click in page text, and smaller fixes.
# The fork pins AnyRender to 814e100d: AnyRender's main renamed anyrender_vello_hybrid
# to anyrender_vello_gpu and changed its API.
dioxus-native = { git = "https://github.com/SinderC/blitz", rev = "d436ebf8", default-features = false }

dirs = "7.0.0"
icu_calendar = { version = "2.4.0", default-features = false }
icu_datetime = "2.4.0"
icu_locale_core = "2.4.0"
icu_segmenter = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
jiff = "1.0.0"
mimalloc = "0.1.48"
# The macOS menu bar: Dioxus Native has none of its own.
muda = { version = "0.20.0", default-features = false }
parley = { version = "0.12.0", default-features = false, features = ["std"] }
rfd = "0.17.2"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.154"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
webbrowser = "1.2.6"
writeable = "0.6.4"
# Already in the tree through keyring (Secret Service), with these default features.
zbus = "5.19.0"
# Its signal stream's `next()`: already in the tree through zbus and reqwest.
futures-util = { version = "0.3.34", default-features = false }
# KDE's window shadows on Wayland (shadow.rs): already in the tree through winit, which
# talks to the same compositor connection.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
wayland-backend = { version = "0.3.17", default-features = false, features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
# KDE's window shadows on X11, through a window property: already in the tree through winit.
x11rb = "0.14.0"
# The Windows version and accent color, from the registry (top_border.rs): already in the
# tree through winit.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

# The guideline set (M-STATIC-VERIFICATION).
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Dependencies we don't control pull in several versions of the same crates.
multiple_crate_versions = "allow"

# winit from a fork, pinned to one commit, in place of the beta.4 that Blitz takes from
# crates.io. On Windows it adds a precision touchpad read through DirectManipulation, and
# the system's resize borders on a window without a title bar
# (`with_undecorated_resize_borders`, chrome.rs). Every crate of the fork, so they don't
# mix with crates.io's.
[patch.crates-io]
dpi = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-android = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-appkit = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-common = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-core = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-orbital = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-uikit = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-wayland = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-web = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-win32 = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }
winit-x11 = { git = "https://github.com/SinderC/winit", rev = "ddb79aa3" }

# Debug builds optimize the dependencies: unoptimized Blitz, Stylo and Vello scroll
# and lay out too slowly to judge the app by. The workspace's crates stay quick to
# build and debug.
[profile.dev.package."*"]
opt-level = 3
