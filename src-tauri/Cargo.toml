[package]
name = "skvaller"
description = "Desktop RSS reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skvaller-core = { path = "../crates/skvaller-core" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri = { version = "2.12.5", features = ["test"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
